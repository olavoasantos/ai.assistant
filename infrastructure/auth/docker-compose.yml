services:
  aiassistant-auth:
    container_name: aiassistant-auth
    image: quay.io/keycloak/keycloak
    command: start-dev
    environment:
      - KC_HOSTNAME=https://auth.aiassistant.test
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=winnipeg123
    ports:
      - '8080:8080'
    restart: unless-stopped
    networks:
      - aiassistant-auth
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-ec',
          'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q ''"status": "UP"'' <&3',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  aiassistant-auth:
    driver: bridge
