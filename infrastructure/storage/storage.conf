server {
    listen 443 ssl;
    server_name  storage.aiassistant.test;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # nginx defaults to 1m — uploads bigger than that get a 413 without this
    client_max_body_size 100m;

    # stream uploads through instead of buffering them to disk first
    proxy_request_buffering off;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://host.docker.internal:9000/;
        error_log /var/log/storage_errors.log;
    }
}
