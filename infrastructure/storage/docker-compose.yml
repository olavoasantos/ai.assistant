services:
  aiassistant-storage:
    container_name: aiassistant-storage
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: winnipeg123
      MINIO_BROWSER_REDIRECT_URL: https://filesystem.aiassistant.test
    volumes:
      - ./infrastructure/storage/data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  aiassistant-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      aiassistant-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://aiassistant-storage:9000 admin winnipeg123 &&
      mc mb --ignore-existing local/app-files &&
      mc anonymous set download local/app-files &&
      echo 'bucket app-files ready (public read)'
      "
